name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Telegram Bot Token'
        required: true
        type: string
      ai_api_key:
        description: 'AI API Key'
        required: true
        type: string
      mongo_url:
        description: 'MongoDB URL'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Configure Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token-from-stdin <<< "$RAILWAY_TOKEN"
          railway init --project-id ${{ vars.RAILWAY_PROJECT_ID }}

      - name: Set Environment Variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BOT_TOKEN: ${{ inputs.bot_token }}
          AI_API_KEY: ${{ inputs.ai_api_key }}
          MONGO_URL: ${{ inputs.mongo_url }}
        run: |
          railway variables set BOT_TOKEN="$BOT_TOKEN"
          railway variables set AI_API_KEY="$AI_API_KEY"
          railway variables set MONGO_URL="$MONGO_URL"

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up
